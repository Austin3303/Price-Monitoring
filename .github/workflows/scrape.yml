name: Scrape Price

on:
  schedule:
    - cron: '0 1 * * *'   # 8:00 AM Bangkok
    - cron: '0 13 * * *'  # 8:00 PM Bangkok
  workflow_dispatch:       # manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4


      - name: Install Tor
        run: |
          sudo apt-get install -y tor
          sudo service tor start
          sleep 5

      - name: Scrape price
        run: |
          pip install requests beautifulsoup4 playwright curl_cffi
          playwright install chromium
          python scraper.py

      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update price"
          git push
